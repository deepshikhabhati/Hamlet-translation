<div class="overall-score card">
  <h3 class="overall-score__heading">Overall Preservation</h3>
  <div class="overall-score__ring-wrap">
    <svg class="overall-score__svg" viewBox="0 0 120 120">
      <circle class="overall-score__track" cx="60" cy="60" r="54" />
      <circle
        class="overall-score__progress"
        cx="60"
        cy="60"
        r="54"
        [attr.stroke]="color"
        [attr.stroke-dasharray]="circumference"
        [attr.stroke-dashoffset]="dashOffset"
      />
    </svg>
    <div class="overall-score__value" [style.color]="color">
      {{ displayScore }}
    </div>
  </div>
  <div class="overall-score__label" [style.color]="color">{{ label }}</div>
</div>
