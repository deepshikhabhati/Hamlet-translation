<div class="version-cards">
  <p class="version-cards__hint">
    <i class="fas fa-hand-pointer"></i>
    Click a card to set <strong>source</strong>, then click another for <strong>target</strong>.
  </p>
  <div class="version-cards__grid">
    <div
      *ngFor="let v of versions"
      class="version-card"
      [class.version-card--source]="v === selectedSource"
      [class.version-card--target]="v === selectedTarget"
      (click)="onCardClick(v)"
    >
      <div class="version-card__header">
        <span class="version-card__label">{{ versionLabels[v] }}</span>
        <div class="version-card__badges">
          <span class="version-card__badge version-card__badge--source" *ngIf="v === selectedSource">Source</span>
          <span class="version-card__badge version-card__badge--target" *ngIf="v === selectedTarget">Target</span>
        </div>
        <div class="version-card__actions">
          <button class="version-card__btn" (click)="copyText(v, $event)" title="Copy text">
            <i class="fas fa-copy"></i>
          </button>
          <button class="version-card__btn" (click)="toggleExpand(v, $event)" title="Expand/collapse">
            <i class="fas" [class.fa-expand-alt]="!isExpanded(v)" [class.fa-compress-alt]="isExpanded(v)"></i>
          </button>
        </div>
      </div>
      <div
        class="version-card__text"
        [class.version-card__text--expanded]="isExpanded(v)"
      >
        {{ isExpanded(v) ? texts[v] : truncate(texts[v]) }}
      </div>
    </div>
  </div>
</div>
