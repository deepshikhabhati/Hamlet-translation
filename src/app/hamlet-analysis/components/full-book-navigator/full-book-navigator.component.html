<nav class="toc-root" aria-label="Hamlet Table of Contents">
  <!-- TOC Header & Branding -->
  <header class="toc-header">
    <div class="toc-title-row">
      <h2 class="toc-main-title">Hamlet</h2>
      <span class="toc-sub-tag">Human German Analysis</span>
    </div>

    <!-- Literary Dimension Selector -->
    <div class="toc-dim-selector-wrap">
      <label for="tocDimSelect" class="toc-dim-label">Literary Dimension</label>
      <select
        id="tocDimSelect"
        class="toc-dim-select"
        [(ngModel)]="selectedDimension"
        (ngModelChange)="onDimensionChange()"
        title="Select literary dimension to evaluate across scenes"
      >
        <option *ngFor="let dim of dimensions" [value]="dim.value">{{ dim.label }}</option>
      </select>
    </div>

    <!-- Search / Filter Input -->
    <div class="toc-search-wrap">
      <div class="toc-search-input-box">
        <svg class="toc-search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          class="toc-search-input"
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
          placeholder="Filter scenes, speakers, ID..."
          aria-label="Filter scenes, speakers, or dialogue ID"
        />
        <button
          *ngIf="searchQuery"
          type="button"
          class="toc-search-clear-btn"
          (click)="clearSearch()"
          aria-label="Clear search"
          title="Clear search"
        >✕</button>
      </div>
    </div>
  </header>

  <!-- Hierarchy Scroll Area -->
  <div class="toc-scroll-area" role="tree" aria-label="Hamlet Acts and Scenes">
    <div
      *ngFor="let act of acts; trackBy: trackByAct"
      class="toc-act-node"
      [class.toc-act-node--active]="selectedActId === act.actNumber"
      role="treeitem"
      [attr.aria-expanded]="act.expanded"
    >
      <!-- Act Header -->
      <div
        class="toc-act-header"
        [class.toc-act-header--selected]="selectedActId === act.actNumber && !selectedSceneId && !selectedDialogueId"
        (click)="selectActNode(act)"
        tabindex="0"
      >
        <button
          type="button"
          class="toc-chevron-btn"
          [attr.aria-expanded]="act.expanded"
          [attr.aria-label]="(act.expanded ? 'Collapse Act ' : 'Expand Act ') + act.actNumber"
          (click)="toggleAct(act, $event)"
          title="Expand/collapse Act scenes"
        >
          <svg
            class="toc-chevron-icon"
            [class.toc-chevron-icon--open]="act.expanded"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <span class="toc-act-title" [style.color]="actColors[act.actNumber] || 'var(--ink)'">
          Act {{ act.actNumber }}
        </span>

        <span class="toc-act-badge">{{ act.scenes.length }} scenes</span>
      </div>

      <!-- Scenes Under Act -->
      <div class="toc-scenes-group" *ngIf="act.expanded" role="group">
        <div
          *ngFor="let scene of act.scenes; trackBy: trackByScene"
          class="toc-scene-wrapper"
          role="treeitem"
          [attr.aria-expanded]="scene.expanded"
        >
          <!-- Scene Row -->
          <div
            class="toc-scene-row"
            [class.toc-scene-row--selected]="selectedSceneId === scene.id && !selectedDialogueId"
            [class.toc-scene-row--child-selected]="selectedSceneId === scene.id && !!selectedDialogueId"
            (click)="selectSceneNode(scene)"
            tabindex="0"
          >
            <!-- Chevron to toggle dialogue expansion -->
            <button
              type="button"
              class="toc-chevron-btn toc-chevron-btn--scene"
              [attr.aria-expanded]="scene.expanded"
              [attr.aria-label]="(scene.expanded ? 'Collapse dialogues in Scene ' : 'Expand dialogues in Scene ') + scene.sceneNumber"
              (click)="toggleScene(scene, $event)"
              title="Expand/collapse dialogue list"
            >
              <svg
                class="toc-chevron-icon"
                [class.toc-chevron-icon--open]="scene.expanded"
                width="11"
                height="11"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>

            <!-- Scene Label (Click selects scene without expanding) -->
            <span class="toc-scene-label" [title]="scene.title">
              <strong>Scene {{ scene.sceneNumber }}</strong>
            </span>

            <!-- Human German Score Pill & Bar -->
            <div
              class="toc-scene-score-box"
              [title]="'Human German ' + selectedDimension + ' score: ' + getScoreDisplay(scene.humanScore) + (scene.units ? ' (' + scene.units + ' units)' : '')"
            >
              <div class="toc-score-microbar" *ngIf="scene.humanScore !== null">
                <div
                  class="toc-score-microfill"
                  [style.width]="getScoreWidth(scene.humanScore)"
                  [style.background-color]="getScoreColor(scene.humanScore)"
                ></div>
              </div>
              <span
                class="toc-scene-score-val"
                [style.color]="getScoreColor(scene.humanScore)"
                [style.background-color]="getScoreBgColor(scene.humanScore)"
              >
                {{ getScoreDisplay(scene.humanScore) }}
              </span>
            </div>
          </div>

          <!-- Dialogues Under Scene -->
          <div class="toc-dialogues-group" *ngIf="scene.expanded" role="group">
            <div
              *ngFor="let dlg of scene.dialogues; trackBy: trackByDialogue"
              class="toc-dialogue-row"
              [class.toc-dialogue-row--selected]="selectedDialogueId === dlg.id"
              (click)="selectDialogueNode(scene, dlg, $event)"
              [attr.title]="dlg.id + ' — ' + dlg.speaker + ': ' + dlg.fullText"
              tabindex="0"
              role="treeitem"
            >
              <div class="toc-dialogue-dot"></div>
              <div class="toc-dialogue-text-block">
                <span class="toc-dialogue-id">{{ dlg.id }}</span>
                <span class="toc-dialogue-sep">—</span>
                <span class="toc-dialogue-speaker">{{ dlg.speaker }}</span>
                <span class="toc-dialogue-sep">—</span>
                <span class="toc-dialogue-preview">{{ dlg.textPreview }}</span>
              </div>
              <span *ngIf="dlg.score !== null" class="toc-dialogue-score" [style.color]="getScoreColor(dlg.score)">
                {{ dlg.score }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty search message -->
    <div *ngIf="acts.length === 0 || (searchQuery && acts[0]?.scenes?.length === 0)" class="toc-empty-msg">
      No scenes or dialogues match "{{ searchQuery }}".
    </div>
  </div>
</nav>
