<!-- Q1 Draggable Card -->
<div 
  *ngIf="showQ1Card"
  class="draggable-card"
  [style.left.px]="q1CardPosition.x"
  [style.top.px]="q1CardPosition.y"
  [style.width.px]="q1CardSize.width"
  [style.height.px]="q1CardExpanded ? q1CardSize.height : 40"
  [class.expanded]="q1CardExpanded">
  
  <div 
    class="card-header" 
    [style.background-color]="q1Color"
    (mousedown)="onCardMouseDown($event, 'q1')">
    <span class="card-title">Q1 Sunburst</span>
    <div class="card-controls">
      <button class="card-button" (click)="toggleCardExpand('q1'); $event.stopPropagation()" title="Expand/Collapse">
        {{ q1CardExpanded ? '−' : '+' }}
      </button>
      <button class="card-button" (click)="closeCard('q1'); $event.stopPropagation()" title="Close">×</button>
    </div>
  </div>
  
  <div class="card-content" *ngIf="q1CardExpanded">
    <div #cardQ1SunburstContainer class="card-sunburst-container"></div>
  </div>
  
  <div 
    *ngIf="q1CardExpanded"
    class="resize-handle"
    (mousedown)="onResizeMouseDown($event, 'q1')"
    title="Resize">
  </div>
</div>
