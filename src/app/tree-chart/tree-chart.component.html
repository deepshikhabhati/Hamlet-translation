<div class="container">
  <div #treeContainer class="tree-container"></div>
  
  <!-- Cards Container -->
  <div class="cards-container">
    <div *ngFor="let node of selectedNodes; let i = index" class="node-card">
      <div class="card-header">
        <div class="header-left">
          <button 
                 [id]="'card-' + i"
                 class="card-button"
                 [class.selected]="selectedCardIds.has('card-' + node.name)"
                 (click)="onCheckboxChange(node, $event)">
            {{ selectedCardIds.has('card-' + node.name) ? 'Selected' : 'Select' }}
          </button>
          <h3>{{ node.name }}</h3>
        </div>
        <button class="close-btn" (click)="removeCard(i)">×</button>
      </div>
      <div class="card-content">
        {{ node.content ? node.content : node.summary }}
      </div>
    </div>
  </div>
</div>
