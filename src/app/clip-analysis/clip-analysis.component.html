<div *ngIf="metrics" class="metrics-box">
  <h3>Comparison Metrics</h3>
  <p><strong>Overlap Count:</strong> {{ metrics.overlapCount }}</p>
  <p><strong>Error Rate:</strong> {{ metrics.errorRate }}</p>
  <p><strong>Symmetric Error:</strong> {{ metrics.symmetricError }}</p>
  <p><strong>Precision:</strong> {{ metrics.precision }}</p>
  <p><strong>Recall:</strong> {{ metrics.recall }}</p>
  <p><strong>F1 Score:</strong> {{ metrics.f1Score }}</p>

</div>
