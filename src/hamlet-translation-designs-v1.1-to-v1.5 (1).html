<script id="data" type="application/json">{"meta": [{"id": "v1.1", "name": "Passage view"}, {"id": "v1.2", "name": "Whole-play drill-down"}, {"id": "v1.3", "name": "Table of contents on top"}, {"id": "v1.4", "name": "Study-first navigation"}, {"id": "v1.5", "name": "Product visual system"}], "src": {"v1.1": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Hamlet Translation Analysis: Passage view<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap\">\n<style>\nbody{margin:0;background:#F6F6F3}\na{color:#2F5FA8}a:hover{color:#1C3F78}\nbutton:focus-visible{outline:2px solid #2F5FA8;outline-offset:2px}\n<\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; background: #F6F6F3; color: #1B1E23; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45\">\n\n  <header style=\"background: #FFFFFF; border-bottom: 1px solid #E2E2DC; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1 1 260px\">\n      <h1 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em\">Hamlet Translation Analysis<\/h1>\n      <div style=\"font-size: 13px; color: #5A5F68\">English source · Human DE · AI DE · Context-aware AI DE — 1,107 passages, 13,284 comparisons<\/div>\n    <\/div>\n    <nav aria-label=\"Views\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #F0F0EC; padding: 4px; border-radius: 10px\">\n      <button type=\"button\" aria-current=\"page\" style=\"border: 0; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: #FFFFFF; color: #1B1E23; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.08)\">Passage<\/button>\n      <button type=\"button\" style=\"border: 0; font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: transparent; color: #4A4F57; cursor: pointer\">Dataset<\/button>\n      <button type=\"button\" style=\"border: 0; font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: transparent; color: #4A4F57; cursor: pointer\">Heatmap<\/button>\n    <\/nav>\n  <\/header>\n\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px; max-width: 1600px; margin: 0 auto; box-sizing: border-box\">\n\n    <aside aria-label=\"Scenes\" style=\"flex: 1 1 220px; max-width: 280px; min-width: 200px; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n        <h2 style=\"margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A4F57\">Scenes<\/h2>\n        <span style=\"font-size: 12px; color: #5A5F68\">Human DE score<\/span>\n      <\/div>\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <sc-for list=\"{{ scenes }}\" as=\"sc\" hint-placeholder-count=\"6\">\n          <button type=\"button\" onClick=\"{{ sc.pick }}\" aria-current=\"{{ sc.current }}\" style=\"{{ sc.style }}\">\n            <span style=\"display: flex; flex-direction: column; gap: 1px; text-align: left\">\n              <span style=\"font-weight: 500\">{{ sc.label }}<\/span>\n              <span style=\"font-size: 12px; color: #5A5F68\">{{ sc.note }}<\/span>\n            <\/span>\n            <span style=\"{{ sc.chip }}\">{{ sc.score }}<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <p style=\"margin: 0; font-size: 12px; color: #5A5F68; line-height: 1.5\">Chip color uses a 70–100 scale, so a 94 and a 97 look different. Orange marks the weakest scenes.<\/p>\n    <\/aside>\n\n    <main style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\n      <section aria-label=\"Passage\" style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px\">\n          <div style=\"display: flex; align-items: center; gap: 8px\">\n            <button type=\"button\" aria-label=\"Previous passage\" style=\"border: 1px solid #D6D6CF; background: #FFFFFF; border-radius: 8px; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1B1E23\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"15 18 9 12 15 6\"><\/polyline><\/svg>\n            <\/button>\n            <div style=\"display: flex; flex-direction: column\">\n              <span style=\"font-size: 18px; font-weight: 600\">{{ sceneTitle }}<\/span>\n              <span style=\"font-size: 13px; color: #5A5F68\">Passage [N] of [TOTAL] · Ophelia reports Hamlet’s visit<\/span>\n            <\/div>\n            <button type=\"button\" aria-label=\"Next passage\" style=\"border: 1px solid #D6D6CF; background: #FFFFFF; border-radius: 8px; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1B1E23\">\n              <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\/polyline><\/svg>\n            <\/button>\n          <\/div>\n          <div role=\"group\" aria-label=\"Translations shown\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n            <span style=\"font-size: 13px; color: #5A5F68; margin-right: 4px\">Compare<\/span>\n            <sc-for list=\"{{ toggles }}\" as=\"tg\" hint-placeholder-count=\"3\">\n              <button type=\"button\" onClick=\"{{ tg.pick }}\" aria-pressed=\"{{ tg.pressed }}\" style=\"{{ tg.style }}\">{{ tg.name }}<\/button>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 12px; background: #F6F6F3; border-radius: 8px; font-size: 13px\">\n          <span>Highlighting <strong>{{ dimName }}<\/strong> evidence<\/span>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"display: inline-block; width: 22px; height: 12px; background: #FCE1CC; box-shadow: inset 0 -2px 0 #B8500A; border-radius: 2px\"><\/span>Lost<\/span>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"display: inline-block; width: 22px; height: 12px; background: #DDE7F7; box-shadow: inset 0 -2px 0 #2F5FA8; border-radius: 2px\"><\/span>Changed<\/span>\n          <span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"text-decoration: underline dotted #6E6550; text-decoration-thickness: 2px; text-underline-offset: 4px\">abc<\/span>Source cue<\/span>\n          <span style=\"margin-left: auto; color: #8A4B12; font-size: 12px; font-weight: 500\">Sample German text and AI scores — swap in dataset values<\/span>\n        <\/div>\n\n        <div style=\"overflow-x: auto\">\n          <div style=\"{{ gridStyle }}\">\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #5A5F68; padding: 0 0 8px\">Speaker<\/div>\n            <div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #5A5F68; padding: 0 0 8px\">English source<\/div>\n            <sc-for list=\"{{ colHeads }}\" as=\"ch\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px; padding: 0 0 8px\">\n                <span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #5A5F68\">{{ ch.name }}<\/span>\n                <span style=\"font-size: 12px; color: #4A4F57\">{{ ch.summary }}<\/span>\n              <\/div>\n            <\/sc-for>\n            <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <div style=\"font-size: 13px; font-weight: 600; color: #4A4F57; padding: 14px 0; border-top: 1px solid #ECECE6\">{{ row.spk }}<\/div>\n              <div style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.6; white-space: pre-line; padding: 12px 0; border-top: 1px solid #ECECE6\"><sc-for list=\"{{ row.src }}\" as=\"seg\"><span style=\"{{ seg.style }}\">{{ seg.t }}<\/span><\/sc-for><\/div>\n              <sc-for list=\"{{ row.vers }}\" as=\"v\">\n                <div lang=\"de\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.6; white-space: pre-line; padding: 12px 0; border-top: 1px solid #ECECE6\"><sc-for list=\"{{ v.segs }}\" as=\"seg\"><span style=\"{{ seg.style }}\">{{ seg.t }}<\/span><\/sc-for><\/div>\n              <\/sc-for>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/section>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n\n        <section aria-label=\"Scores by dimension\" style=\"flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Scores by dimension<\/h2>\n            <span style=\"font-size: 13px; color: #5A5F68\">Select a row to highlight its evidence in the passage. Outlined cell = best version.<\/span>\n          <\/div>\n          <div style=\"overflow-x: auto\">\n            <div style=\"min-width: 360px; display: flex; flex-direction: column\">\n              <div style=\"{{ mHead }}\">\n                <span style=\"font-size: 12px; font-weight: 600; color: #5A5F68; text-transform: uppercase; letter-spacing: 0.05em\">Dimension<\/span>\n                <sc-for list=\"{{ colHeads }}\" as=\"ch\"><span style=\"font-size: 12px; font-weight: 600; color: #5A5F68; text-align: center\">{{ ch.short }}<\/span><\/sc-for>\n              <\/div>\n              <sc-for list=\"{{ mRows }}\" as=\"mr\" hint-placeholder-count=\"9\">\n                <button type=\"button\" onClick=\"{{ mr.pick }}\" aria-pressed=\"{{ mr.pressed }}\" style=\"{{ mr.style }}\">\n                  <span style=\"font-weight: {{ mr.weight }}\">{{ mr.name }}<\/span>\n                  <sc-for list=\"{{ mr.cells }}\" as=\"c\"><span style=\"{{ c.style }}\">{{ c.val }}<\/span><\/sc-for>\n                <\/button>\n              <\/sc-for>\n              <div style=\"{{ mFoot }}\">\n                <span style=\"font-weight: 600\">Overall<\/span>\n                <sc-for list=\"{{ overall }}\" as=\"o\"><span style=\"text-align: center; font-weight: 600; font-variant-numeric: tabular-nums\">{{ o.val }}<\/span><\/sc-for>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <section aria-label=\"Flagged issues\" style=\"flex: 1 1 340px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"display: flex; flex-direction: column; gap: 2px\">\n            <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Flagged issues<\/h2>\n            <span style=\"font-size: 13px; color: #5A5F68\">Only problems are listed, worst first. Dimensions with nothing to report are hidden.<\/span>\n          <\/div>\n          <sc-for list=\"{{ issues }}\" as=\"is\" hint-placeholder-count=\"4\">\n            <button type=\"button\" onClick=\"{{ is.pick }}\" style=\"{{ is.style }}\">\n              <span style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n                <span style=\"{{ is.sevStyle }}\">{{ is.sev }}<\/span>\n                <span style=\"font-size: 12px; color: #4A4F57; font-weight: 500\">{{ is.dimName }} · {{ is.verName }}<\/span>\n              <\/span>\n              <span style=\"font-weight: 600; font-size: 15px\">{{ is.title }}<\/span>\n              <span style=\"font-size: 14px; color: #3D424A\">{{ is.body }}<\/span>\n            <\/button>\n          <\/sc-for>\n          <sc-if value=\"{{ noIssues }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 0; font-size: 14px; color: #5A5F68\">No issues for the translations shown.<\/p>\n          <\/sc-if>\n        <\/section>\n\n      <\/div>\n    <\/main>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":1560}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { dim: \"emo\", vis: { h: true, a: true, c: true }, scene: \"a2s1\" };\n  }\n\n  renderVals() {\n    const st = this.state || {};\n    const dim = st.dim || \"emo\";\n    const vis = st.vis || { h: true, a: true, c: true };\n    const scene = st.scene || \"a2s1\";\n\n    const DIMS = [\n      { k: \"sem\", name: \"Semantic preservation\" },\n      { k: \"emo\", name: \"Emotion\" },\n      { k: \"met\", name: \"Metaphor / imagery\" },\n      { k: \"tone\", name: \"Tone\" },\n      { k: \"voice\", name: \"Character voice\" },\n      { k: \"word\", name: \"Wordplay\" },\n      { k: \"cult\", name: \"Cultural / archaic language\" },\n      { k: \"omit\", name: \"Omissions / additions\" },\n      { k: \"pref\", name: \"Human preference\" }\n    ];\n    const VERS = [\n      { k: \"h\", name: \"Human DE\", short: \"Human\" },\n      { k: \"a\", name: \"AI DE\", short: \"AI\" },\n      { k: \"c\", name: \"Context-aware AI DE\", short: \"Context AI\" }\n    ];\n    const SC = {\n      h: { sem: 94, emo: 80, met: 89, tone: 82, voice: 86, word: 95, cult: 89, omit: 94, pref: 89 },\n      a: { sem: 91, emo: 84, met: 78, tone: 74, voice: 76, word: 70, cult: 72, omit: 97, pref: 75 },\n      c: { sem: 95, emo: 90, met: 88, tone: 87, voice: 89, word: 86, cult: 90, omit: 95, pref: 88 }\n    };\n    const OVERALL = { h: \"89.7\", a: \"79.7\", c: \"89.8\" };\n\n    const LINES = [\n      { spk: \"Ophelia\",\n        src: [{ t: \"O, my lord, my lord, \", f: { tone: \"cue\", voice: \"cue\" } }, { t: \"I have been so affrighted!\", f: { emo: \"cue\" } }],\n        h: [{ t: \"O Vater, Vater, \", f: { tone: \"changed\" } }, { t: \"ich hab mich so erschreckt!\" }],\n        a: [{ t: \"Oh, mein Herr, mein Herr, \", f: { tone: \"changed\", voice: \"changed\", cult: \"changed\" } }, { t: \"ich habe mich so erschrocken!\", f: { cult: \"changed\" } }],\n        c: [{ t: \"O Vater, Vater, \", f: { tone: \"changed\" } }, { t: \"wie hab ich mich erschreckt!\" }] },\n      { spk: \"Polonius\",\n        src: [{ t: \"Mad for thy love?\", f: { emo: \"cue\", word: \"cue\", sem: \"cue\" } }],\n        h: [{ t: \"Aus Liebe toll?\" }],\n        a: [{ t: \"Verrückt nach deiner Liebe?\", f: { word: \"lost\", sem: \"changed\", emo: \"changed\" } }],\n        c: [{ t: \"Wahnsinnig aus Liebe zu dir?\", f: { word: \"changed\" } }] },\n      { spk: \"Ophelia\",\n        src: [{ t: \"My lord, \", f: { tone: \"cue\", voice: \"cue\" } }, { t: \"I do not know,\\nBut truly \" }, { t: \"I do fear it.\", f: { emo: \"cue\", sem: \"cue\" } }],\n        h: [{ t: \"Ich weiß nicht, Vater,\\n\" }, { t: \"doch fast scheint es mir so.\", f: { emo: \"lost\", sem: \"changed\" } }],\n        a: [{ t: \"Mein Herr, \", f: { tone: \"changed\", voice: \"changed\" } }, { t: \"ich weiß es nicht,\\naber ich fürchte es wirklich.\", f: { cult: \"changed\" } }],\n        c: [{ t: \"Ich weiß es nicht, Vater,\\ndoch fürcht ich's wahrhaftig.\" }] },\n      { spk: \"Ophelia\",\n        src: [{ t: \"He raised a sigh so piteous and profound\", f: { emo: \"cue\", met: \"cue\" } }, { t: \"\\nAs it did seem to \" }, { t: \"shatter all his bulk\", f: { met: \"cue\" } }, { t: \"\\nAnd end his being.\" }],\n        h: [{ t: \"Er seufzte tief und kläglich,\", f: { emo: \"changed\" } }, { t: \"\\nals wollt' es ihn \" }, { t: \"zerbrechen\", f: { met: \"changed\" } }, { t: \"\\nund enden all sein Sein.\" }],\n        a: [{ t: \"Er stieß einen so jämmerlichen und tiefen Seufzer aus, dass er seinen ganzen Körper zu zerschmettern schien und sein Dasein zu beenden.\", f: { met: \"changed\", cult: \"changed\", pref: \"changed\" } }],\n        c: [{ t: \"Er tat so tief und jammervoll ein Seufzen,\\nals sollt' es ganz den \" }, { t: \"Leib ihm sprengen\", f: { met: \"changed\" } }, { t: \"\\nund enden all sein Sein.\" }] }\n    ];\n\n    const ISSUES = [\n      { dim: \"emo\", v: \"h\", sev: 3, title: \"Fear drops out of Ophelia’s answer\", body: \"“I do fear it” becomes “doch fast scheint es mir so”. Source cues fear, grief, love, mad; the German keeps only Liebe.\" },\n      { dim: \"word\", v: \"a\", sev: 3, title: \"“Mad for thy love” read as “crazy about you”\", body: \"“Verrückt nach deiner Liebe” is an idiom for infatuation. Polonius is asking whether love has driven Hamlet mad.\" },\n      { dim: \"tone\", v: \"a\", sev: 2, title: \"Ophelia calls her father “mein Herr”\", body: \"A literal “my lord” makes a daughter sound like a servant. Both other versions use “Vater”.\" },\n      { dim: \"cult\", v: \"a\", sev: 2, title: \"Verse flattened into modern prose\", body: \"Line 4 becomes one long modern sentence; the three-line verse shape is gone.\" },\n      { dim: \"met\", v: \"h\", sev: 1, title: \"“Shatter all his bulk” softened\", body: \"“zerbrechen” keeps the breaking image but loses the physical body.\" },\n      { dim: \"word\", v: \"c\", sev: 1, title: \"Wordplay made explicit\", body: \"“Wahnsinnig aus Liebe zu dir?” adds “zu dir”, narrowing the ambiguity of “thy love”.\" }\n    ];\n\n    const visible = VERS.filter((v) => vis[v.k]);\n    const n = visible.length;\n\n    const segStyle = (flag) => {\n      if (flag === \"lost\") return \"background:#FCE1CC; box-shadow:inset 0 -2px 0 #B8500A; border-radius:2px\";\n      if (flag === \"changed\") return \"background:#DDE7F7; box-shadow:inset 0 -2px 0 #2F5FA8; border-radius:2px\";\n      if (flag === \"cue\") return \"text-decoration:underline dotted #6E6550; text-decoration-thickness:2px; text-underline-offset:4px\";\n      return \"\";\n    };\n    const segs = (arr) => arr.map((s) => ({ t: s.t, style: segStyle(s.f && s.f[dim]) }));\n\n    const rows = LINES.map((ln) => ({\n      spk: ln.spk,\n      src: segs(ln.src),\n      vers: visible.map((v) => ({ k: v.k, segs: segs(ln[v.k]) }))\n    }));\n\n    const colHeads = visible.map((v) => {\n      let lost = 0, changed = 0;\n      LINES.forEach((ln) => ln[v.k].forEach((s) => {\n        const f = s.f && s.f[dim];\n        if (f === \"lost\") lost++;\n        if (f === \"changed\") changed++;\n      }));\n      const parts = [];\n      parts.push(lost + \" lost\");\n      parts.push(changed + \" changed\");\n      return { name: v.name, short: v.short, summary: \"Score \" + SC[v.k][dim] + \" · \" + parts.join(\" · \") };\n    });\n\n    const minW = 90 + 240 * (1 + n);\n    const gridStyle = \"display:grid; grid-template-columns: 90px repeat(\" + (1 + n) + \", minmax(220px, 1fr)); column-gap: 24px; min-width:\" + minW + \"px\";\n\n    const cellColors = (val) => {\n      if (val < 80) return \"background:#F4C29C; color:#5C2400\";\n      if (val < 88) return \"background:#FBE3CF; color:#6E3408\";\n      if (val < 93) return \"background:#EEF0F3; color:#2B2F36\";\n      return \"background:#CFDDF4; color:#173A70\";\n    };\n    const mCols = \"grid-template-columns: minmax(150px, 1.6fr) repeat(\" + n + \", minmax(64px, 1fr))\";\n    const mHead = \"display:grid; \" + mCols + \"; gap: 6px; padding: 0 10px 8px; align-items:end\";\n    const mFoot = \"display:grid; \" + mCols + \"; gap: 6px; padding: 12px 10px 0; margin-top: 6px; border-top: 2px solid #1B1E23; align-items:center\";\n\n    const mRows = DIMS.map((d) => {\n      const vals = visible.map((v) => SC[v.k][d.k]);\n      const best = Math.max.apply(null, vals);\n      const sel = d.k === dim;\n      return {\n        name: d.name,\n        weight: sel ? \"600\" : \"400\",\n        pressed: sel ? \"true\" : \"false\",\n        pick: () => this.setState({ dim: d.k }),\n        style: \"display:grid; \" + mCols + \"; gap: 6px; align-items:center; width:100%; min-height:44px; padding: 4px 10px; border:0; border-radius:8px; font:inherit; color:#1B1E23; text-align:left; cursor:pointer; background:\" + (sel ? \"#E6EDF9\" : \"transparent\"),\n        cells: visible.map((v) => {\n          const val = SC[v.k][d.k];\n          const ring = val === best && n > 1 ? \"; box-shadow: inset 0 0 0 2px #1B1E23\" : \"\";\n          return { val: String(val), style: \"display:flex; align-items:center; justify-content:center; height:34px; border-radius:6px; font-weight:600; font-variant-numeric:tabular-nums; \" + cellColors(val) + ring };\n        })\n      };\n    });\n\n    const overall = visible.map((v) => ({ val: OVERALL[v.k] }));\n\n    const toggles = VERS.map((v) => {\n      const on = !!vis[v.k];\n      return {\n        name: v.name,\n        pressed: on ? \"true\" : \"false\",\n        pick: () => {\n          const next = Object.assign({}, vis);\n          if (on && n === 1) return;\n          next[v.k] = !on;\n          this.setState({ vis: next });\n        },\n        style: \"font:inherit; font-size:14px; font-weight:500; min-height:44px; padding:8px 14px; border-radius:999px; cursor:pointer; \" + (on ? \"background:#1B1E23; color:#FFFFFF; border:1px solid #1B1E23\" : \"background:#FFFFFF; color:#4A4F57; border:1px solid #C9C9C1\")\n      };\n    });\n\n    const sevLabel = { 3: \"High\", 2: \"Medium\", 1: \"Low\" };\n    const sevStyle = {\n      3: \"font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:#B8500A; color:#FFFFFF\",\n      2: \"font-size:12px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #B8500A; color:#8A3C06\",\n      1: \"font-size:12px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid #9A9A92; color:#4A4F57\"\n    };\n    const dimName = (k) => (DIMS.find((d) => d.k === k) || {}).name;\n    const verName = (k) => (VERS.find((v) => v.k === k) || {}).name;\n    const issues = ISSUES.filter((i) => vis[i.v]).sort((x, y) => y.sev - x.sev).map((i) => ({\n      sev: sevLabel[i.sev],\n      sevStyle: sevStyle[i.sev],\n      dimName: dimName(i.dim),\n      verName: verName(i.v),\n      title: i.title,\n      body: i.body,\n      pick: () => this.setState({ dim: i.dim }),\n      style: \"display:flex; flex-direction:column; gap:6px; width:100%; text-align:left; font:inherit; color:#1B1E23; padding:14px; border-radius:10px; cursor:pointer; \" + (i.dim === dim ? \"background:#E6EDF9; border:1px solid #9DB6DF\" : \"background:#FAFAF8; border:1px solid #E2E2DC\")\n    }));\n\n    const SCENES = [\n      { id: \"a1\", label: \"Act 1\", note: \"5 scenes\", score: 95 },\n      { id: \"a2s1\", label: \"Act 2 · Scene 1\", note: \"Weakest: Emotion 80\", score: 94 },\n      { id: \"a2s2\", label: \"Act 2 · Scene 2\", note: \"\", score: 95 },\n      { id: \"a3\", label: \"Act 3\", note: \"4 scenes\", score: 97 },\n      { id: \"a4\", label: \"Act 4\", note: \"7 scenes\", score: 97 },\n      { id: \"a5\", label: \"Act 5\", note: \"2 scenes\", score: 94 }\n    ];\n    const chip = (s) => {\n      const c = s <= 94 ? \"background:#FBE3CF; color:#6E3408\" : s >= 97 ? \"background:#CFDDF4; color:#173A70\" : \"background:#EEF0F3; color:#2B2F36\";\n      return \"min-width:40px; text-align:center; padding:4px 8px; border-radius:6px; font-weight:600; font-variant-numeric:tabular-nums; \" + c;\n    };\n    const scenes = SCENES.map((s) => {\n      const cur = s.id === scene;\n      return {\n        label: s.label,\n        note: s.note,\n        score: String(s.score),\n        chip: chip(s.score),\n        current: cur ? \"true\" : \"false\",\n        pick: () => this.setState({ scene: s.id }),\n        style: \"display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; min-height:48px; padding:8px 10px; border-radius:8px; font:inherit; font-size:14px; color:#1B1E23; cursor:pointer; border:0; \" + (cur ? \"background:#E6EDF9\" : \"background:transparent\")\n      };\n    });\n    const sceneTitle = (SCENES.find((s) => s.id === scene) || SCENES[1]).label;\n\n    return {\n      rows, colHeads, gridStyle, mRows, mHead, mFoot, overall, toggles, issues, scenes, sceneTitle,\n      dimName: dimName(dim),\n      noIssues: issues.length === 0\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "v1.2": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Hamlet Translation Analysis v1.2: whole-play drill-down<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap\">\n<style>\nbody{margin:0;background:#F6F6F3}\na{color:#2F5FA8}a:hover{color:#1C3F78}\nbutton:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #2F5FA8;outline-offset:2px}\n<\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; background: #F6F6F3; color: #1B1E23; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45\">\n\n  <header style=\"background: #FFFFFF; border-bottom: 1px solid #E2E2DC; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1 1 300px\">\n      <div style=\"display: flex; align-items: center; gap: 10px\">\n        <h1 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em\">Hamlet Translation Analysis<\/h1>\n        <span style=\"font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #1B1E23; color: #FFFFFF\">v1.2<\/span>\n      <\/div>\n      <div style=\"font-size: 13px; color: #5A5F68\">English source compared with Human German, AI German and Context-aware AI German, across the whole play<\/div>\n    <\/div>\n    <nav aria-label=\"Views\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #F0F0EC; padding: 4px; border-radius: 10px\">\n      <button type=\"button\" aria-current=\"page\" style=\"border: 0; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: #FFFFFF; color: #1B1E23; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.08)\">Read and analyze<\/button>\n      <button type=\"button\" style=\"border: 0; font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: transparent; color: #4A4F57; cursor: pointer\">Evidence heatmap<\/button>\n      <button type=\"button\" style=\"border: 0; font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: transparent; color: #4A4F57; cursor: pointer\">Validation queue<\/button>\n    <\/nav>\n  <\/header>\n\n  <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; padding: 20px; max-width: 1720px; margin: 0 auto; box-sizing: border-box\">\n\n    <aside aria-label=\"Table of contents\" style=\"flex: 1 1 250px; max-width: 300px; min-width: 220px; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px\">\n        <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Hamlet<\/h2>\n        <span style=\"font-size: 12px; color: #5A5F68\">5 acts, 20 scenes<\/span>\n      <\/div>\n      <sc-for list=\"{{ acts }}\" as=\"act\" hint-placeholder-count=\"5\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px\">\n          <button type=\"button\" onClick=\"{{ act.toggle }}\" aria-expanded=\"{{ act.expanded }}\" style=\"display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 8px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #1B1E23; cursor: pointer; text-align: left\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"{{ act.chev }}\"><polyline points=\"9 18 15 12 9 6\"><\/polyline><\/svg>\n            <span style=\"flex: 1\">{{ act.label }}<\/span>\n            <span style=\"font-size: 12px; font-weight: 400; color: #5A5F68\">{{ act.meta }}<\/span>\n          <\/button>\n          <sc-if value=\"{{ act.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px; padding-left: 14px\">\n              <sc-for list=\"{{ act.scenes }}\" as=\"sc\">\n                <div style=\"display: flex; align-items: stretch; gap: 2px\">\n                  <sc-if value=\"{{ sc.hasSpeeches }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" onClick=\"{{ sc.toggleSpeeches }}\" aria-expanded=\"{{ sc.expanded }}\" aria-label=\"Show speeches\" style=\"width: 32px; min-height: 44px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: #4A4F57; display: flex; align-items: center; justify-content: center; padding: 0\">\n                      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"{{ sc.chev }}\"><polyline points=\"9 18 15 12 9 6\"><\/polyline><\/svg>\n                    <\/button>\n                  <\/sc-if>\n                  <button type=\"button\" onClick=\"{{ sc.pick }}\" aria-current=\"{{ sc.current }}\" style=\"{{ sc.style }}\">\n                    <span>{{ sc.label }}<\/span>\n                    <span style=\"font-size: 12px; color: #5A5F68\">{{ sc.meta }}<\/span>\n                  <\/button>\n                <\/div>\n                <sc-if value=\"{{ sc.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display: flex; flex-direction: column; gap: 1px; padding-left: 34px; border-left: 1px solid #E2E2DC; margin-left: 15px\">\n                    <sc-for list=\"{{ sc.speeches }}\" as=\"sp\">\n                      <button type=\"button\" onClick=\"{{ sp.pick }}\" aria-current=\"{{ sp.current }}\" style=\"{{ sp.style }}\">\n                        <span style=\"display: flex; align-items: center; gap: 6px\">\n                          <span style=\"font-size: 12px; font-weight: 600; color: #4A4F57\">{{ sp.spk }}<\/span>\n                          <sc-if value=\"{{ sp.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: #1B1E23; color: #FFFFFF\">{{ sp.tag }}<\/span><\/sc-if>\n                        <\/span>\n                        <span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; color: #1B1E23\">{{ sp.first }}<\/span>\n                      <\/button>\n                    <\/sc-for>\n                    <span style=\"font-size: 12px; color: #5A5F68; padding: 6px 8px\">[N] more speeches in this scene<\/span>\n                  <\/div>\n                <\/sc-if>\n              <\/sc-for>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n      <\/sc-for>\n    <\/aside>\n\n    <main style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px\">\n        <nav aria-label=\"Breadcrumb\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 14px\">\n          <sc-for list=\"{{ crumbs }}\" as=\"cr\" hint-placeholder-count=\"3\">\n            <span style=\"display: flex; align-items: center; gap: 4px\">\n              <sc-if value=\"{{ cr.notFirst }}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"color: #9A9A92\">/<\/span><\/sc-if>\n              <button type=\"button\" onClick=\"{{ cr.pick }}\" aria-current=\"{{ cr.current }}\" style=\"{{ cr.style }}\">{{ cr.label }}<\/button>\n            <\/span>\n          <\/sc-for>\n        <\/nav>\n        <ol aria-label=\"Analysis level\" style=\"display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none\">\n          <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n            <li style=\"{{ st.style }}\"><span style=\"font-weight: 600\">{{ st.num }}<\/span> {{ st.label }}<\/li>\n          <\/sc-for>\n        <\/ol>\n      <\/div>\n\n      <sc-if value=\"{{ showSceneReal }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <section aria-label=\"Scene overview\" style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-end\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                <h2 style=\"margin: 0; font-size: 22px; font-weight: 600\">Act 1, Scene 1<\/h2>\n                <span style=\"font-size: 14px; color: #4A4F57\">Elsinore, a platform before the castle. [N] speeches, 7 in the benchmark set (A1-01 to A1-07)<\/span>\n              <\/div>\n              <span style=\"font-size: 12px; font-weight: 500; color: #8A3C06; padding: 4px 10px; border-radius: 999px; border: 1px solid #E5B58E\">Illustrative scene scores: aggregation not yet computed<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <h3 style=\"margin: 0; font-size: 16px; font-weight: 600\">How well does each translation preserve the scene?<\/h3>\n              <span style=\"font-size: 13px; color: #5A5F68\">Each translation against the English source, aggregated over the scene’s speeches. “n” is how many units the dimension applies to; low-coverage cells are dashed.<\/span>\n            <\/div>\n            <div style=\"overflow-x: auto\">\n              <div style=\"min-width: 560px; display: flex; flex-direction: column\">\n                <div style=\"{{ mHead }}\">\n                  <span>Dimension<\/span><span style=\"text-align: center\">Human DE<\/span><span style=\"text-align: center\">AI DE<\/span><span style=\"text-align: center\">Context AI DE<\/span><span style=\"text-align: center\">Context effect<\/span>\n                <\/div>\n                <sc-for list=\"{{ sceneRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ r.rowStyle }}\">\n                    <span style=\"font-weight: 500\">{{ r.name }}<\/span>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\">\n                      <span style=\"{{ c.style }}\"><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{ c.val }}<\/span><span style=\"font-size: 11px; font-weight: 400\">{{ c.n }}<\/span><\/span>\n                    <\/sc-for>\n                    <span style=\"{{ r.effStyle }}\">{{ r.eff }}<\/span>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 14px; background: #F6F6F3; border-radius: 8px; font-size: 13px; color: #3D424A\">\n              <span><strong>Aggregation:<\/strong> [document method, e.g. mean over applicable units weighted by source length]<\/span>\n              <span><strong>N/A units:<\/strong> excluded from the mean and counted in n<\/span>\n              <span><strong>Context effect:<\/strong> Context AI minus AI; positive means context helped<\/span>\n            <\/div>\n          <\/section>\n\n          <section aria-label=\"Speeches in this scene\" style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <h3 style=\"margin: 0; font-size: 16px; font-weight: 600\">Speeches, ranked by how much context changed the result<\/h3>\n              <span style=\"font-size: 13px; color: #5A5F68\">Overall score against English. Open a speech to compare it by dimension and see its clauses.<\/span>\n            <\/div>\n            <div style=\"overflow-x: auto\">\n              <div style=\"min-width: 640px; display: flex; flex-direction: column\">\n                <div style=\"{{ spHead }}\">\n                  <span>Passage<\/span><span>Feature<\/span><span style=\"text-align: center\">Human<\/span><span style=\"text-align: center\">AI<\/span><span style=\"text-align: center\">Context AI<\/span><span style=\"text-align: center\">Context effect<\/span><span><\/span>\n                <\/div>\n                <sc-for list=\"{{ benchRows }}\" as=\"b\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ b.rowStyle }}\">\n                    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 600\">{{ b.id }}<\/span><span style=\"font-size: 12px; color: #4A4F57\">{{ b.spk }}<\/span><\/span>\n                    <span style=\"font-size: 13px; color: #3D424A\">{{ b.feat }}<\/span>\n                    <sc-for list=\"{{ b.cells }}\" as=\"c\"><span style=\"{{ c.style }}\">{{ c.val }}<\/span><\/sc-for>\n                    <span style=\"{{ b.effStyle }}\">{{ b.eff }}<\/span>\n                    <button type=\"button\" onClick=\"{{ b.pick }}\" style=\"font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 6px 14px; border-radius: 8px; border: 1px solid #C9C9C1; background: #FFFFFF; color: #1B1E23; cursor: pointer\">Open<\/button>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ showScenePending }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n          <h2 style=\"margin: 0; font-size: 22px; font-weight: 600\">{{ sceneLabel }}<\/h2>\n          <p style=\"margin: 0; max-width: 60ch; color: #3D424A\">This scene has no computed results yet. Once its speeches are analyzed, the seven-dimension scene matrix and the ranked speech list appear here.<\/p>\n          <button type=\"button\" onClick=\"{{ goExample }}\" style=\"font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 0; background: #1B1E23; color: #FFFFFF; cursor: pointer\">See Act 1, Scene 1<\/button>\n        <\/section>\n      <\/sc-if>\n\n      <sc-if value=\"{{ showSpeechPending }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 32px; display: fl tiveSteps = !inSpeech ? [1] : hasClause ? [2, 3, 4] : [2, 3];\n    const steps = [[\"L1\", \"Scene\"], [\"L2\", \"Speech\"], [\"L3\", \"Clause\"], [\"L4\", \"Evidence\"]].map((s, i) => {\n      const on = activeSteps.indexOf(i + 1) >= 0;\n      return { num: s[0], label: s[1], style: \"font-size:13px; padding:6px 10px; border-radius:6px; \" + (on ? \"background:#1B1E23; color:#FFFFFF\" : \"background:#EBEBE6; color:#4A4F57\") };\n    });\n\n    const pend = SPEECHES.find((x) => x.id === S.speech) || BENCH.find((x) => x.id === S.speech) || { spk: \"\", first: \"\" };\n\n    return {\n      acts, crumbs, steps, mHead, sceneRows, spHead, benchRows, speechRows, dimChips, clauseGrid, clauses, insp,\n      valTargets, verdicts, savedText, sceneLabel,\n      showSceneReal: S.view === \"scene\" && sceneId === \"1.1\",\n      showScenePending: S.view === \"scene\" && sceneId !== \"1.1\",\n      showSpeech,\n      showSpeechPending: inSpeech && !showSpeech,\n      showInspector: hasClause,\n      pendingSpk: pend.spk, pendingText: pend.first || (\"Benchmark passage \" + (S.speech || \"\") + \": text to be loaded from the dataset\"),\n      savedShow: !!S.saved,\n      saveVal: () => this.setState({ saved: true }),\n      closeInsp: () => set({ clause: null }),\n      goExample: () => set({ view: \"scene\", scene: \"1.1\", speech: null, clause: null }),\n      goA101: () => set({ view: \"speech\", scene: \"1.1\", speech: \"A1-01\", clause: null })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "v1.3": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Hamlet Translation Analysis v1.3: table of contents on top<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap\">\n<style>\nbody{margin:0;background:#F6F6F3}\na{color:#2F5FA8}a:hover{color:#1C3F78}\nbutton:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #2F5FA8;outline-offset:2px}\n<\/style>\n<\/helmet>\n<div style=\"min-height: 100vh; background: #F6F6F3; color: #1B1E23; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45\">\n\n  <header style=\"background: #FFFFFF; border-bottom: 1px solid #E2E2DC; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px\">\n    <div style=\"display: flex; flex-direction: column; gap: 2px; flex: 1 1 300px\">\n      <div style=\"display: flex; align-items: center; gap: 10px\">\n        <h1 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em\">Hamlet Translation Analysis<\/h1>\n        <span style=\"font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #1B1E23; color: #FFFFFF\">v1.3<\/span>\n      <\/div>\n      <div style=\"font-size: 13px; color: #5A5F68\">English source compared with Human German, AI German and Context-aware AI German, across the whole play<\/div>\n    <\/div>\n    <nav aria-label=\"Views\" style=\"display: flex; flex-wrap: wrap; gap: 4px; background: #F0F0EC; padding: 4px; border-radius: 10px\">\n      <button type=\"button\" aria-current=\"page\" style=\"border: 0; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: #FFFFFF; color: #1B1E23; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.08)\">Read and analyze<\/button>\n      <button type=\"button\" style=\"border: 0; font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: transparent; color: #4A4F57; cursor: pointer\">Evidence heatmap<\/button>\n      <button type=\"button\" style=\"border: 0; font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 7px; background: transparent; color: #4A4F57; cursor: pointer\">Validation queue<\/button>\n    <\/nav>\n  <\/header>\n\n  <div style=\"padding: 20px; max-width: 1720px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px\">\n\n    <section aria-label=\"Table of contents\" style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px\">\n        <div style=\"display: flex; flex-direction: column; min-width: 120px\">\n          <h2 style=\"margin: 0; font-size: 18px; font-weight: 600\">Hamlet<\/h2>\n          <span style=\"font-size: 12px; color: #5A5F68\">5 acts, 20 scenes<\/span>\n        <\/div>\n        <div role=\"group\" aria-label=\"Acts\" style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n          <sc-for list=\"{{ actTabs }}\" as=\"at\" hint-placeholder-count=\"5\">\n            <button type=\"button\" onClick=\"{{ at.pick }}\" aria-pressed=\"{{ at.pressed }}\" style=\"{{ at.style }}\">\n              <span style=\"font-weight: 600; font-size: 14px\">{{ at.label }}<\/span>\n              <span style=\"{{ at.metaStyle }}\">{{ at.meta }}<\/span>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n      <div role=\"group\" aria-label=\"Scenes\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 12px; border-top: 1px solid #ECECE6\">\n        <sc-for list=\"{{ sceneChips }}\" as=\"sc\" hint-placeholder-count=\"5\">\n          <button type=\"button\" onClick=\"{{ sc.pick }}\" aria-current=\"{{ sc.current }}\" style=\"{{ sc.style }}\">\n            <span>{{ sc.label }}<\/span>\n            <sc-if value=\"{{ sc.hasMeta }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ sc.metaStyle }}\">{{ sc.meta }}<\/span><\/sc-if>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n      <sc-if value=\"{{ showStrip }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #ECECE6\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px\">\n            <span style=\"font-size: 13px; font-weight: 600; color: #3D424A\">Speeches in Act 1, Scene 1<\/span>\n            <button type=\"button\" onClick=\"{{ toggleStrip }}\" aria-expanded=\"{{ stripExpanded }}\" style=\"font: inherit; font-size: 13px; font-weight: 500; min-height: 40px; padding: 4px 12px; border-radius: 8px; border: 1px solid #C9C9C1; background: #FFFFFF; color: #1B1E23; cursor: pointer\">{{ stripLabel }}<\/button>\n          <\/div>\n          <sc-if value=\"{{ stripOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px\">\n              <sc-for list=\"{{ speechCards }}\" as=\"sp\" hint-placeholder-count=\"6\">\n                <button type=\"button\" onClick=\"{{ sp.pick }}\" aria-current=\"{{ sp.current }}\" style=\"{{ sp.style }}\">\n                  <span style=\"display: flex; align-items: center; gap: 6px\">\n                    <span style=\"font-size: 11px; color: #5A5F68\">{{ sp.num }}<\/span>\n                    <span style=\"font-size: 12px; font-weight: 600; color: #4A4F57\">{{ sp.spk }}<\/span>\n                    <sc-if value=\"{{ sp.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: #1B1E23; color: #FFFFFF\">{{ sp.tag }}<\/span><\/sc-if>\n                  <\/span>\n                  <span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 14px; line-height: 1.4; color: #1B1E23\">{{ sp.first }}<\/span>\n                <\/button>\n              <\/sc-for>\n              <span style=\"flex: none; align-self: center; font-size: 12px; color: #5A5F68; padding: 0 10px\">[N] more speeches<\/span>\n            <\/div>\n          <\/sc-if>\n        <\/div>\n      <\/sc-if>\n    <\/section>\n\n    <div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px\">\n\n    <main style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px\">\n        <nav aria-label=\"Breadcrumb\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 14px\">\n          <sc-for list=\"{{ crumbs }}\" as=\"cr\" hint-placeholder-count=\"3\">\n            <span style=\"display: flex; align-items: center; gap: 4px\">\n              <sc-if value=\"{{ cr.notFirst }}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"color: #9A9A92\">/<\/span><\/sc-if>\n              <button type=\"button\" onClick=\"{{ cr.pick }}\" aria-current=\"{{ cr.current }}\" style=\"{{ cr.style }}\">{{ cr.label }}<\/button>\n            <\/span>\n          <\/sc-for>\n        <\/nav>\n        <ol aria-label=\"Analysis level\" style=\"display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none\">\n          <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n            <li style=\"{{ st.style }}\"><span style=\"font-weight: 600\">{{ st.num }}<\/span> {{ st.label }}<\/li>\n          <\/sc-for>\n        <\/ol>\n      <\/div>\n\n      <sc-if value=\"{{ showSceneReal }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <section aria-label=\"Scene overview\" style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: flex-end\">\n              <div style=\"display: flex; flex-direction: column; gap: 2px\">\n                <h2 style=\"margin: 0; font-size: 22px; font-weight: 600\">Act 1, Scene 1<\/h2>\n                <span style=\"font-size: 14px; color: #4A4F57\">Elsinore, a platform before the castle. [N] speeches, 7 in the benchmark set (A1-01 to A1-07)<\/span>\n              <\/div>\n              <span style=\"font-size: 12px; font-weight: 500; color: #8A3C06; padding: 4px 10px; border-radius: 999px; border: 1px solid #E5B58E\">Illustrative scene scores: aggregation not yet computed<\/span>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <h3 style=\"margin: 0; font-size: 16px; font-weight: 600\">How well does each translation preserve the scene?<\/h3>\n              <span style=\"font-size: 13px; color: #5A5F68\">Each translation against the English source, aggregated over the scene’s speeches. “n” is how many units the dimension applies to; low-coverage cells are dashed.<\/span>\n            <\/div>\n            <div style=\"overflow-x: auto\">\n              <div style=\"min-width: 560px; display: flex; flex-direction: column\">\n                <div style=\"{{ mHead }}\">\n                  <span>Dimension<\/span><span style=\"text-align: center\">Human DE<\/span><span style=\"text-align: center\">AI DE<\/span><span style=\"text-align: center\">Context AI DE<\/span><span style=\"text-align: center\">Context effect<\/span>\n                <\/div>\n                <sc-for list=\"{{ sceneRows }}\" as=\"r\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ r.rowStyle }}\">\n                    <span style=\"font-weight: 500\">{{ r.name }}<\/span>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\">\n                      <span style=\"{{ c.style }}\"><span style=\"font-weight: 600; font-variant-numeric: tabular-nums\">{{ c.val }}<\/span><span style=\"font-size: 11px; font-weight: 400\">{{ c.n }}<\/span><\/span>\n                    <\/sc-for>\n                    <span style=\"{{ r.effStyle }}\">{{ r.eff }}<\/span>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 14px; background: #F6F6F3; border-radius: 8px; font-size: 13px; color: #3D424A\">\n              <span><strong>Aggregation:<\/strong> [document method, e.g. mean over applicable units weighted by source length]<\/span>\n              <span><strong>N/A units:<\/strong> excluded from the mean and counted in n<\/span>\n              <span><strong>Context effect:<\/strong> Context AI minus AI; positive means context helped<\/span>\n            <\/div>\n          <\/section>\n\n          <section aria-label=\"Speeches in this scene\" style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-direction: column; gap: 2px\">\n              <h3 style=\"margin: 0; font-size: 16px; font-weight: 600\">Speeches, ranked by how much context changed the result<\/h3>\n              <span style=\"font-size: 13px; color: #5A5F68\">Overall score against English. Open a speech to compare it by dimension and see its clauses.<\/span>\n            <\/div>\n            <div style=\"overflow-x: auto\">\n              <div style=\"min-width: 640px; display: flex; flex-direction: column\">\n                <div style=\"{{ spHead }}\">\n                  <span>Passage<\/span><span>Feature<\/span><span style=\"text-align: center\">Human<\/span><span style=\"text-align: center\">AI<\/span><span style=\"text-align: center\">Context AI<\/span><span style=\"text-align: center\">Context effect<\/span><span><\/span>\n                <\/div>\n                <sc-for list=\"{{ benchRows }}\" as=\"b\" hint-placeholder-count=\"7\">\n                  <div style=\"{{ b.rowStyle }}\">\n                    <span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 600\">{{ b.id }}<\/span><span style=\"font-size: 12px; color: #4A4F57\">{{ b.spk }}<\/span><\/span>\n                    <span style=\"font-size: 13px; color: #3D424A\">{{ b.feat }}<\/span>\n                    <sc-for list=\"{{ b.cells }}\" as=\"c\"><span style=\"{{ c.style }}\">{{ c.val }}<\/span><\/sc-for>\n                    <span style=\"{{ b.effStyle }}\">{{ b.eff }}<\/span>\n                    <button type=\"button\" onClick=\"{{ b.pick }}\" style=\"font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 6px 14px; border-radius: 8px; border: 1px solid #C9C9C1; background: #FFFFFF; color: #1B1E23; cursor: pointer\">Open<\/button>\n                  <\/div>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n\n      <sc-if value=\"{{ showScenePending }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start\">\n          <h2 style=\"margin: 0; font-size: 22px; font-weight: 600\">{{ sceneLabel }}<\/h2>\n          <p style=\"margin: 0; max-width: 60ch; color: #3D424A\">This scene has no computed results yet. Once its speeches are analyzed, the seven-dimension scene matrix and the ranked speech list appear here.<\/p>\n          <button type=\"button\" onClick=\"{{ goExample }}\" style=\"font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 8px 16px; border-radius: 8px; border: 0; background: #1B1E23; color: #FFFFFF; cursor: pointer\">See Act 1, Scene 1<\/button>\n        <\/section>\n      <\/sc-if>\n\n      <sc-if value=\"{{ showSpeechPending }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 12px; align-items: flex-star he scores<\/span>\n      <span>Semantic preservation against the English source, 0 to 100 (higher is closer).<\/span>\n      <span style=\"display: flex; align-items: center; gap: 4px\">\n        <sc-for list=\"{{ scale }}\" as=\"sw\"><span style=\"{{ sw.style }}\">{{ sw.label }}<\/span><\/sc-for>\n      <\/span>\n      <span style=\"display: flex; align-items: center; gap: 10px\">Compare line (scene table 80 to 100, heatmap 60 to 100):\n        <span style=\"display: flex; align-items: center; gap: 4px\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"5\" r=\"4.5\" fill=\"#B8500A\"><\/circle><\/svg>Human (top)<\/span>\n        <span style=\"display: flex; align-items: center; gap: 4px\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><rect x=\"1\" y=\"1\" width=\"8\" height=\"8\" fill=\"#384152\"><\/rect><\/svg>AI (middle)<\/span>\n        <span style=\"display: flex; align-items: center; gap: 4px\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 10 10\" aria-hidden=\"true\"><polygon points=\"5,0 10,5 5,10 0,5\" fill=\"#2F5FA8\"><\/polygon><\/svg>Context AI (bottom)<\/span>\n        <span>grey bar = spread<\/span>\n      <\/span>\n      <span>Spread: highest minus lowest of the three. To review: phrases flagged for an expert.<\/span>\n      <span>Context AI values come from the prototype; Human, AI and review counts are illustrative.<\/span>\n    <\/div>\n  <\/section>\n\n  <div style=\"max-width: 1680px; margin: 0 auto; padding: 20px 24px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px\">\n    <main style=\"flex: 999 1 600px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 20px\">\n\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 10px 0; border-bottom: 1px solid var(--line)\">\n        <nav aria-label=\"Bread >\n            <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px\">\n              <h3 style=\"margin: 0; font-size: 17px; font-weight: 600\">Which clause produces the difference?<\/h3>\n              <span style=\"font-size: 12px; color: var(--muted)\">Highlighting: {{ dimName }}<\/span>\n            <\/div>\n            <p style=\"margin: 0; font-size: 13px; color: var(--muted); max-width: 75ch\">Clauses are aligned by meaning, not sentence boundaries; the German keeps its own punctuation. Underlined English words are the source cues.<\/p>\n            <div style=\"overflow-x: auto\">\n              <div style=\"display: grid; grid-template-columns: 130px repeat(4, minmax(180px, 1fr)); column-gap: 16px; min-width: 980px\">\n                <span style=\"{{ colHead }}\">Clause<\/span><span style=\"{{ colHead }}\">English<\/span><span style=\"{{ colHead }}\">Human DE<\/span><span style=\"{{ colHead }}\">AI DE<\/span><span style=\"{{ colHead }}\">Context AI DE<\/span>\n                <sc-for list=\"{{ clauses }}\" as=\"cl\" hint-placeholder-count=\"3\">\n                  <div style=\"{{ cl.labelStyle }}\">\n                    <span style=\"font-weight: 600; font-size: 14px\">{{ cl.label }}<\/span>\n                    <span style=\"font-size: 12px; color: var(--muted)\">{{ cl.concept }}<\/span>\n                    <button type=\"button\" class=\"press\" onClick=\"{{ cl.pick }}\" aria-pressed=\"{{ cl.pressed }}\" style=\"{{ cl.btnStyle }}\">Inspect<\/button>\n                  <\/div>\n                  <div style=\"{{ cl.cellStyle }}\">\n                    <span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.55\"><sc-for list=\"{{ cl.src }}\" as=\"seg\"><span style=\"{{ seg.style }}\">{{ seg.t }}<\/span><\/sc-for><\/span>\n                  <\/div>\n                  <sc-for list=\"{{ cl.vers }}\" as=\"v\">\n                    <div style=\"{{ cl.cellStyle }}\">\n                      <span style=\"{{ v.chipStyle }}\">{{ v.status }}<\/span>\n                      <span lang=\"de\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.55\"><sc-for list=\"{{ v.segs }}\" as=\"seg\"><span style=\"{{ seg.style }}\">{{ seg.t }}<\/span><\/sc-for><\/span>\n                    <\/div>\n                  <\/sc-for>\n                <\/sc-for>\n              <\/div>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n    <\/main>\n\n    <sc-if value=\"{{ showInspector }}\" hint-placeholder-val=\"{{ false }}\">\n      <aside class=\"insp\" aria-label=\"Evidence inspector\" style=\"flex: 1 1 340px; max-width: 420px; min-width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 8px\">\n          <div style=\"display: flex; flex-direction: column\">\n            <h2 style=\"margin: 0; font-size: 16px; font-weight: 600\">Evidence inspector<\/h2>\n            <span style=\"font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums\">{{ insp.where }}<\/span>\n          <\/div>\n          <button type=\"button\" class=\"press\" onClick=\"{{ closeInsp }}\" aria-label=\"Close inspector\" style=\"width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink)\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\/line><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\/line><\/svg>\n          <\/button>\n        <\/div>\n        <dl style=\"margin: 0; display: grid; grid-t ht: 600\">Rule evidence<\/h3>\n            <span style=\"font-size: 13px\"><code style=\"font-size: 12px; font-weight: 600\">R_LENGTH_CONTENT_RATIO<\/code> <span style=\"color: var(--muted)\">content length and token-ratio correspondence<\/span><\/span>\n            <span style=\"font-size: 13px\"><code style=\"font-size: 12px; font-weight: 600\">R_PUNCTUATION_RHYTHM<\/code> <span style=\"color: var(--muted)\">punctuation and rhetorical cadence<\/span><\/span>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ insp.noRules }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-size: 13px; color: var(--muted)\">No rule triggered for this alignment; phrase spans not yet extracted.<\/span>\n        <\/sc-if>\n        <sc-if value=\"{{ insp.hasExpl }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <h3 style=\"margin: 0; font-size: 13px; font-weight: 600\">Literary explanation<\/h3>\n            <p style=\"margin: 0; font-size: 14px; max-width: 70ch\">{{ insp.expl }}<\/p>\n          <\/div>\n        <\/sc-if>\n        <form onSubmit=\"{{ saveVal }}\" style=\"display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line)\">\n          <h3 style=\"margin: 0; font-size: 13px; font-weight: 600\">Expert validation<\/h3>\n          <fieldset style=\"border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px\">\n            <legend style=\"font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 4px\">Translation<\/legend>\n            <div style=\"display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden\">\n              <sc-for list=\"{{ valTargets }}\" as=\"vt\" hint-placeholder-count=\"3\">\n                <button type=\"button\" onClick=\"{{ vt.pick }}\" aria-pressed=\"{{ vt.pressed }}\" style=\"{{ vt.style }}\">{{ vt.name }}<\/button>\n              <\/sc-for>\n            <\/div>\n          <\/fieldset>\n          <fieldset style=\"border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px\">\n            <legend style=\"font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 4px\">Your judgment<\/legend>\n            <div style=\"display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden\">\n              <sc-for list=\"{{ verdicts }}\" as=\"vd\" hint-placeholder-count=\"3\">\n                <button type=\"button\" onClick=\"{{ vd.pick }}\" aria-pressed=\"{{ vd.pressed }}\" style=\"{{ vd.style }}\">{{ vd.name }}<\/button>\n              <\/sc-for>\n            <\/div>\n          <\/fieldset>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted)\">Corrected classification\n            <select name=\"corrected_classification\" style=\"font: inherit; font-size: 14px; color: var(--ink); min-height: 40px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface)\">\n              <option>No correction<\/option><option>Preserved<\/option><option>Changed<\/option><option>Lost<\/option><option>Added<\/option><option>Not applicable<\/option>\n            <\/select>\n          <\/label>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted)\">Comment\n            <textarea name=\"comment\" rows=\"3\" style=\"font: inherit; font-size: 14px; color: var(--ink); padding: 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; background: var(--surface)\"><\/textarea>\n          <\/label>\n          <label style=\"display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted)\">Reviewer name and affiliation\n            <input name=\"reviewer\" type=\"text\" style=\"font: inherit; font-size: 14px; color: var(--ink); min-height: 40px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6 ><span>English<\/span><span>Dimension<\/span><span>Issue<\/span><span>Status<\/span><span><\/span><\/div>\n            <sc-for list=\"{{ qRows }}\" as=\"q\" hint-placeholder-count=\"6\">\n              <div style=\"{{ qRowStyle }}\">\n                <span style=\"{{ q.priStyle }}\">{{ q.pri }}<\/span>\n                <span style=\"display: flex; flex-direction: column; line-height: 1.3\"><span style=\"font-weight: 600; font-size: 14px\">{{ q.scene }}<\/span><span style=\"font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums\">{{ q.where }}<\/span><\/span>\n                <span style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 15px\">{{ q.en }}<\/span>\n                <span style=\"font-size: 14px\">{{ q.dim }}<\/span>\n                <span style=\"font-size: 13px; color: var(--ink-2)\">{{ q.issue }}<span style=\"display: block; font-size: 12px; color: var(--muted)\">{{ q.vers }}<\/span><\/span>\n                <span style=\"{{ q.statusStyle }}\">{{ q.status }}<\/span>\n                <button type=\"button\" class=\"press\" onClick=\"{{ q.pick }}\" style=\"font: inherit; font-size: 13px; font-weight: 600; min-height: 38px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--ink); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap\">{{ q.action }}<\/button>\n              <\/div>\n            <\/sc-for>\n            <sc-if value=\"{{ qEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin: 0; padding: 16px 4px; font-size: 14px; color: var(--ink-2)\">Nothing here for this filter. Switch to “All” or another issue type.<\/p>\n            <\/sc-if>\n            <p style=\"margin: 0; padding: 12px 4px 0; font-size: 12px; color: var(--muted)\">[84 more flagged phrases from the dataset]<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":1440,\"height\":2200}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { view: \"scene\", scene: \"1.1\", speech: null, tocAct: 1, stripOpen: false, mode: \"rec\", filter: \"all\", dim: \"sem\", clause: null, phrase: null, valTarget: \"a\", verdict: null, saved: false, page: \"read\", book: null, reviewed: {}, hmMode: \"cmp\", hmAct: \"all\", hmMax: \"all\", qStatus: \"open\", qIssue: \"all\" };\n  }\n\n  renderVals() {\n    const S = this.state || {};\n    const set = (o) => this.setState(Object.assign({ saved: false }, o));\n    const NUM = \"font-variant-numeric:tabular-nums;\";\n\n    const DIMS = [\n      { k: \"sem\", name: \"Semantic\" }, { k: \"emo\", name: \"Emotion\" }, { k: \"met\", name: \"Metaphor / imagery\" },\n      { k: \"tone\", name: \"Tone\" }, { k: \"voice\", name: \"Character voice\" }, { k: \"cult\", name: \"Cultural / archaic\" },\n      { k: \"omit\", name: \"Omissions / additions\" }\n    ];\n    const dimName = (k) => DIMS.find((d) => d.k === k).name;\n    const VERS = [{ k: \"h\", name: \"Human DE\", short: \"Human\" }, { k: \"a\", name: \"AI DE\", short: \"AI\" }, { k: \"c\", name: \"Context AI DE\", short: \"Context AI\" }];\n    const dim = S.dim || \"sem\";\n\n    // one score scale for the whole page\n    const SCALE = [\n      { max: 60, label: \"below 60\", bg: \"#F2C4D3\", fg: \"#5C0F2B\" },\n      { max: 85, label: \"60-84\", bg: \"#F9E1E9\", fg: \"#6E1A37\" },\n      { max: 93, label: \"85-92\", bg: \"#E9ECF1\", fg: \"#2A303C\" },\n      { max: 97, label: \"93-96\", bg: \"#DCEFD9\", fg: \"#1E5631\" },\n      { max: 101, label: \"97-100\", bg: \"#BEE2B8\", fg: \"#15401F\" }\n    ];\n    const band = (v) => SCALE.find((b) => v < b.max);\n    const numCell = (v, h) => { const b = band(v); return \"display:flex; align-items:center; justify-content:flex-end; padding:0 8px; height:\" + (h || 28) + \"px; border-radius:4px; font-weight:600; \" + NUM + \" background:\" + b.bg + \"; color:\" + b.fg; };\n    const scale = SCALE.map((b) => ({ label: b.label, style: \"padding:1px 6px; border-radius:4px; font-weight:600; \" + NUM + \" background:\" + b.bg + \"; color:\" + b.fg }));\n\n    // scene-level semantic scores: Context AI from the prototype, Human/AI/flags illustrative\n    const SCN = {\n      \"1.1\": { d: \"The Ghost appears on the battlements\", h: 93, a: 96, c: 98, f: 4 },\n      \"1.2\": { d: \"Claudius’s court; “O, that this too too solid flesh”\", h: 90, a: 95, c: 98, f: 6 },\n      \"1.3\": { d: \"Laertes and Polonius advise Ophelia\", h: 95, a: 97, c: 98, f: 2 },\n      \"1.4\": { d: \"Hamlet waits for the Ghost\", h: 96, a: 98, c: 99, f: 1 },\n      \"1.5\": { d: \"The Ghost reveals the murder\", h: 84, a: 88, c: 91, f: 9 },\n      \"2.1\": { d: \"Polonius and Reynaldo; Ophelia’s report\", h: 94, a: 96, c: 98, f: 3 },\n      \"2.2\": { d: \"Rosencrantz, Guildenstern and the players\", h: 86, a: 93, c: 99, f: 11 },\n      \"3.1\": { d: \"“To be, or not to be”; the nunnery scene\", h: 89, a: 94, c: 98, f: 7 },\n      \"3.2\": { d: \"The play within the play\", h: 87, a: 95, c: 98, f: 8 },\n      \"3.3\": { d: \"Claudius at prayer\", h: 95, a: 97, c: 98, f: 2 },\n      \"3.4\": { d: \"The closet scene; Polonius is killed\", h: 91, a: 95, c: 98, f: 5 },\n      \"4.1\": { d: \"Gertrude tells Claudius\", h: 97, a: 98, c: 99, f: 0 },\n      \"4.2\": { d: \"Hamlet hides the body\", h: 96, a: 98, c: 99, f: 1 },\n      \"4.3\": { d: \"Hamlet is sent to England\", h: 94, a: 96, c: 97, f: 3 },\n      \"4.4\": { d: \"Fortinbras’s army; “How all occasions”\", h: 93, a: 95, c: 97, f: 2 },\n      \"4.5\": { d: \"Ophelia’s madness; Laertes returns\", h: 88, a: 94, c: 98, f: 6 },\n      \"4.6\": { d: \"Letters from Hamlet\", h: 96, a: 97, c: 97, f: 1 },\n      \"4.7\": { d: \"The plot against Hamlet; Ophelia’s death\", h: 92, a: 95, c: 98, f: 4 },\n      \"5.1\": { d: \"The gravediggers; Yorick\", h: 85, a: 92, c: 99, f: 10 },\n      \"5.2\": { d: \"The duel and the deaths\", h: 91, a: 96, c: 99, f: 5 }\n    };\n    const SCENE_COUNTS = [5, 2, 4, 7, 2];\n    const ids = Object.keys(SCN);\n    const sceneLabelOf = (id) => \"Act \" + id.split(\".\")[0] + \", Scene \" + id.split(\".\")[1];\n    const spreadOf = (s) => Math.max(s.h, s.a, s.c) - Math.min(s.h, s.a, s.c);\n\n    const HINT = {\n      rec: \"Combines how far apart the three versions are, how many phrases need review, and the lowest score.\",\n      spread: \"Scenes where Human, AI and Context AI scores are furthest apart.\",\n      flags: \"Scenes with the most phrases flagged for expert review.\",\n      ctx: \"Scenes where adding dramatic context changed the AI translation most.\",\n      low: \"Scenes where at least one translation preserves the least.\"\n    };\n    const mode = S.mode || \"rec\";\n    const metric = (s) => {\n      const mn = Math.min(s.h, s.a, s.c);\n      if (mode === \"spread\") return spreadOf(s);\n      if (mode === \"flags\") return s.f;\n      if (mode === \"ctx\") return Math.abs(s.c - s.a);\n      if (mode === \"low\") return 100 - mn;\n      return spreadOf(s) + s.f + (100 - mn) * 0.5;\n    };\n    const reason = (s) => {\n      const mn = Math.min(s.h, s.a, s.c);\n      const who = s.h === mn ? \"Human\" : s.a === mn ? \"AI\" : \"Context AI\";\n      if (mode === \"spread\") return \"Scores \" + spreadOf(s) + \" points apart\";\n      if (mode === \"flags\") return s.f + \" phrases flagged for review\";\n      if (mode === \"ctx\") return \"Context AI \" + (s.c - s.a >= 0 ? \"+\" : \"-\") + Math.abs(s.c - s.a) + \" against AI\";\n      if (mode === \"low\") return \"Lowest: \" + who + \" at \" + mn;\n      return spreadOf(s) + \"-point spread, \" + s.f + \" to review, \" + who + \" lowest\";\n    };\n    const ranked = ids.slice().sort((x, y) => metric(SCN[y]) - metric(SCN[x]));\n    const rankOf = {};\n    ranked.forEach((id, i) => { rankOf[id] = i + 1; });\n    const nums = (s, h) => [s.h, s.a, s.c].map((v) => ({ val: S
